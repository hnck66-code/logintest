name: PHP Test

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CI: true

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: mysqli

    - name: Install PHPUnit
      run: |
        composer require phpunit/phpunit --dev

    - name: Run Tests
      run: vendor/bin/phpunit
